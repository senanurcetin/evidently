name: Fork HitRate Regression QA

on:
  push:
    branches:
      - qa/hitrate-pr1961-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hitrate-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    timeout-minutes: 20
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and QA tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'pytest==7.4.4' 'ruff==0.3.7'

      - name: Ruff diagnostics
        run: |
          python -m ruff check --diff src/evidently/legacy/metrics/recsys/hit_rate_k.py tests/metrics/recsys/test_hit_rate_k.py src/evidently/legacy/metrics/recsys/base_top_k.py tests/metrics/recsys/test_recall_top_k.py || true
          python -m ruff format --diff src/evidently/legacy/metrics/recsys/hit_rate_k.py tests/metrics/recsys/test_hit_rate_k.py src/evidently/legacy/metrics/recsys/base_top_k.py tests/metrics/recsys/test_recall_top_k.py || true

      - name: HitRate and neighboring Recall tests
        run: |
          python -m pytest -q tests/metrics/recsys --tb=short

      - name: Ruff acceptance
        if: always()
        run: |
          python -m ruff check src/evidently/legacy/metrics/recsys/hit_rate_k.py tests/metrics/recsys/test_hit_rate_k.py src/evidently/legacy/metrics/recsys/base_top_k.py tests/metrics/recsys/test_recall_top_k.py
          python -m ruff format --check src/evidently/legacy/metrics/recsys/hit_rate_k.py tests/metrics/recsys/test_hit_rate_k.py src/evidently/legacy/metrics/recsys/base_top_k.py tests/metrics/recsys/test_recall_top_k.py
