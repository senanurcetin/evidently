name: OSS HitRate Snapshot QA

on:
  push:
    branches:
      - qa/hitrate-snapshot-1233
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hitrate-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Evidently and QA tools
        run: |
          python -m pip install -e . 'pandas>=2.2,<3.0'
          python -m pip install 'pytest==7.4.4' 'ruff==0.3.7'
          python -c "import pandas; print('QA pandas version:', pandas.__version__)"

      - name: Test HitRate@k and neighboring recommendation metrics
        run: |
          python -m pytest -q tests/metrics/recsys/test_hit_rate_k.py tests/metrics/recsys/test_recall_top_k.py --tb=short

      - name: Lint and formatting
        if: always()
        run: |
          python -m ruff check src/evidently/legacy/metrics/recsys/hit_rate_k.py tests/metrics/recsys/test_hit_rate_k.py
          python -m ruff format --check src/evidently/legacy/metrics/recsys/hit_rate_k.py tests/metrics/recsys/test_hit_rate_k.py
