name: Fork TopK PR 1961 edge-case review

on:
  push:
    branches: ["qa/topk-pr1961-edge-review"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topk-review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Evidently and checks
        run: |
          python -m pip install -e .
          python -m pip install pytest==7.4.4 ruff==0.3.7
      - name: Test upstream integration plus expected edge failures
        run: |
          python -m pytest -q tests/metrics/recsys/test_top_k_pr1961_edge_review.py --tb=short -rx
      - name: Ruff
        run: |
          python -m ruff check tests/metrics/recsys/test_top_k_pr1961_edge_review.py
          python -m ruff format --check tests/metrics/recsys/test_top_k_pr1961_edge_review.py
